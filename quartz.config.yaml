# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Jose Miguel
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: jose-miguel.vercel.app
  ignorePatterns:
    - private
    - templates
    - .obsidian

  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "transparent"  # Allows custom background gradient to show
        lightgray: "#dcdce6"  # Slightly darker borders for contrast
        gray: "#4a4a5a"       # WCAG Compliant medium gray text
        darkgray: "#1c1a24"   # WCAG Compliant near-black body/sidebar text (4.5:1+ contrast)
        dark: "#110f18"       # Sharp dark headers
        secondary: "#6200ee"  # Deep, readable purple hyperlinks
        tertiary: "#84a59d"
        highlight: "rgba(98, 0, 238, 0.08)"
        textHighlight: "#fff23688"
      darkMode:
        light: "transparent"  # Allows custom background gradient to show
        lightgray: "#202026"
        gray: "#a0a0b5"
        darkgray: "#e2e2e9"
        dark: "#ffffff"
        secondary: "#9d77ff"  # Neon purple hyperlinks for dark mode
        tertiary: "#84a59d"
        highlight: "rgba(157, 119, 255, 0.15)"
        textHighlight: "#b3aa0288"

# Custom Styling Injections for Backgrounds, Bullets, and Layout Accents
css: |
  :root {
    // 1. WCAG OPTIMIZED LIGHT MODE GRADIENT
    &[saved-theme="light"] {
      background: linear-gradient(135deg, #f2ecfc 0%, #f7f5fa 30%, #f5f5f5 70%, #f5f5f5 100%) !important;
      background-attachment: fixed !important;
      
      // Bright Purple Bullets inside your Markdown pages (.md files)
      main li::marker, .popover li::marker {
        color: #7c4dff !important;
        font-size: 1.1em;
      }

      // Adds a subtle purple tint to the explorer sidebar file lines
      .folder-container div::before {
        border-left: 1px solid #7c4dff !important;
      }
    }
    
    // 2. DARK MODE GRADIENT
    &[saved-theme="dark"] {
      background: linear-gradient(135deg, #0a0a0c 0%, #120e25 40%, #101833 80%, #0d0d11 100%) !important;
      background-attachment: fixed !important;
      
      // Dark Purple Bullets inside your Markdown pages (.md files)
      main li::marker, .popover li::marker {
        color: #9d77ff !important;
        font-size: 1.1em;
      }

      // Adds a purple tint to the explorer sidebar lines in dark mode
      .folder-container div::before {
        border-left: 1px solid #4f2d8c !important;
      }
    }
  }

  // 3. TITLE TYPING ANIMATION EFFECT
  .page-title a {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace; /* Monospace font makes each letter take exact same width */
    overflow: hidden;                       /* Hides the text that hasn't been typed yet */
    border-right: 3px solid #9d77ff;        /* The blinking cursor line */
    white-space: nowrap;                    /* Keeps the title on a single flat line */
    margin: 0 auto; 
    letter-spacing: 0.05em; 
    
    /* Exact step count matching characters in "JmEsperat" (9 letters) */
    width: 9ch;                             
    animation: 
      typing 2.5s steps(9, end) infinite alternate,
      blink-caret 0.75s step-end infinite;
  }

  // Keyframes for the typewriter reveal effect
  @keyframes typing {
    from { width: 0 }
    to { width: 9ch }
  }

  // Keyframes for the blinking purple line cursor
  @keyframes blink-caret {
    from, to { border-color: transparent }
    50% { border-color: #9d77ff; }
  }

  // 4. PANELS TRANSPARENCY FIX
  body, .page, #quartz-body, .left, .right, .center, main {
    background: transparent !important;
  }


plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
