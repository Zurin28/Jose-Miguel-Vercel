# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Jose Miguel
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: jose-miguel.vercel.app
  ignorePatterns:
    - private
    - templates
    - .obsidian

  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "transparent"  # Allows high-contrast custom gradient to display
        lightgray: "#cbd5e1"  # Soft slate border color for clean lines
        gray: "#334155"       # High-contrast charcoal text for readability
        darkgray: "#0f172a"   # Crisp slate-black text (Exceeds WCAG 4.5:1 ratio)
        dark: "#1e1b4b"       # Deep dark indigo headers
        secondary: "#5b21b6"  # Premium dark purple for clickable hyperlinks
        tertiary: "#84a59d"
        highlight: "rgba(91, 33, 182, 0.06)"
        textHighlight: "#fff23688"
      darkMode:
        light: "transparent"  # Allows dark custom gradient to display
        lightgray: "#202026"
        gray: "#a0a0b5"
        darkgray: "#e2e2e9"
        dark: "#ffffff"
        secondary: "#9d77ff"  # Vibrant neon purple hyperlinks
        tertiary: "#84a59d"
        highlight: "rgba(157, 119, 255, 0.15)"
        textHighlight: "#b3aa0288"

# High-Utility CSS Injections for Layout Accents, Inverted Gradients & Bullets
css: |
  :root {
    // 1. INVERTED LIGHT MODE GRADIENT (Whitesmoke on top-left sidebar, fading to dark purple)
    &[saved-theme="light"] {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 25%, #e2e8f0 60%, #311042 100%) !important;
      background-attachment: fixed !important;
      
      // Strict markdown document list bullets (Bright Purple)
      main li::marker, .popover li::marker {
        color: #6d28d9 !important;
        font-size: 1.1em;
      }

      // Sidebar folder nesting guide lines (Purple)
      .folder-container div::before {
        border-left: 1px solid #6d28d9 !important;
      }
    }
    
    // 2. DARK MODE GRADIENT (Dark Blue, Purple, and Black)
    &[saved-theme="dark"] {
      background: linear-gradient(135deg, #0a0a0c 0%, #120e25 40%, #101833 80%, #0d0d11 100%) !important;
      background-attachment: fixed !important;
      
      // Strict markdown document list bullets (Vibrant Purple)
      main li::marker, .popover li::marker {
        color: #9d77ff !important;
        font-size: 1.1em;
      }

      // Sidebar folder nesting guide lines (Muted Purple)
      .folder-container div::before {
        border-left: 1px solid #4f2d8c !important;
      }
    }
  }

  // 3. EXPLORER SIDEBAR FOLDER ICON FIX (Ensures folder text color contrasts with the background)
  .folder-button {
    color: var(--darkgray) !important;
  }

  // 4. COMPLETE TYPING ANIMATION ENGINE
  .page-title a {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace; 
    overflow: hidden;                       
    border-right: 3px solid #9d77ff;        
    white-space: nowrap;                    
    margin: 0 auto; 
    letter-spacing: 0.05em; 
    width: 9ch;                             
    animation: 
      typing 2.5s steps(9, end) infinite alternate,
      blink-caret 0.75s step-end infinite;
  }

  @keyframes typing {
    from { width: 0 }
    to { width: 9ch }
  }

  @keyframes blink-caret {
    from, to { border-color: transparent }
    50% { border-color: #9d77ff; }
  }

  // 5. INTERIOR CONTAINER FIXES
  body, .page, #quartz-body, .left, .right, .center, main {
    background: transparent !important;
  }


plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
